<!DOCTYPE html>
<html>

<head>
    <title>Sticky Notes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        nav {
            background-color: #333;
            padding: 10px;
            color: white;
        }

        nav a,
        nav button {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .create-btn {
            display: inline-block;
            margin-bottom: 20px;
        }

        nav a:hover,
        nav button:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .note-card {
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .note-card h3 {
            margin-top: 0;
        }

        .note-actions {
            margin-top: 10px;
        }

        .btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-edit {
            background-color: #4CAF50;
            color: white;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
        }

        .btn-create {
            background-color: #2196F3;
            color: white;
            margin-bottom: 15px;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .pinned {
            position: absolute;
            top: 5px;
            right: 8px;
            font-size: 18px;
        }

        .pagination {
            margin-top: 20px;
        }

        .pagination a {
            margin: 5px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/notes/">Notes</a>

        {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% else %}
        <a href="/login/">Login</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
